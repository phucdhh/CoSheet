services:
  ethercalc:
    image: audreyt/ethercalc
    ports:
      - "5234:8000"
    environment:
      REDIS_PORT_6379_TCP_ADDR: redis
      REDIS_PORT_6379_TCP_PORT: 6379
    depends_on:
      - redis
    restart: always
  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

volumes:
  redis_data:
